esphome:
  name: bthome-test

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:

external_components:
  # For local development; replace with the github:// source for normal use:
  # - source: github://mvoss96/esphome-bthome-broadcaster
  #   components: [bthome_broadcaster]
  - source:
      type: local
      path: components

esp32_ble:

sensor:
  - platform: internal_temperature
    id: cpu_temp

  - platform: template
    id: fake_humidity
    lambda: return 42.0;
    update_interval: 30s

binary_sensor:
  - platform: template
    id: fake_motion
    lambda: return millis() % 20000 < 10000;

text_sensor:
  - platform: template
    id: status_text
    lambda: return {"OK"};
    update_interval: 60s

# Demo: broadcast BTHome events from any automation.
interval:
  - interval: 60s
    then:
      - bthome_broadcaster.button_event:
          event: press
      - bthome_broadcaster.dimmer_event:
          event: rotate_left
          steps: 3

bthome_broadcaster:
  interval: 10s
  # AES-CCM encryption; enter the same 32-hex-char key in Home Assistant when
  # adding the device. Remove the line for plaintext broadcasts.
  encryption_key: "231d39c1d7cc1ab1aee224cd096db932"
  sensors:
    - type: temperature
      source: cpu_temp
    - type: humidity
      source: fake_humidity
  binary_sensors:
    - type: motion
      source: fake_motion
  text_sensors:
    - source: status_text
