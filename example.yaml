esphome:
  name: bthome-test

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:

external_components:
  # For local development; replace with the github:// source for normal use:
  # - source: github://mvoss96/esphome-bthome-broadcaster
  #   components: [bthome_broadcaster]
  - source:
      type: local
      path: components

esp32_ble:

sensor:
  - platform: internal_temperature
    id: cpu_temp

  - platform: template
    id: fake_humidity
    lambda: return 42.0;
    update_interval: 30s

binary_sensor:
  - platform: template
    id: fake_motion
    lambda: return millis() % 20000 < 10000;

text_sensor:
  - platform: template
    id: status_text
    lambda: return {"OK"};
    update_interval: 60s

# Demo: broadcast BTHome events from any automation.
interval:
  - interval: 60s
    then:
      - bthome_broadcaster.button_event:
          event: press
      - bthome_broadcaster.dimmer_event:
          event: rotate_left
          steps: 3
      # Command events instruct another BTHome device; this config is
      # encrypted, which is what the spec advises for them.
      - bthome_broadcaster.command_event:
          command: toggle
      - bthome_broadcaster.command_event:
          command: step_up
          steps: 5

bthome_broadcaster:
  interval: 10s
  # AES-CCM encryption; enter the same 32-hex-char key in Home Assistant when
  # adding the device. Remove the line for plaintext broadcasts.
  #
  # The all-zero value below is a placeholder that keeps the encrypted path
  # buildable in CI -- do NOT deploy it. Generate your own key with
  # `openssl rand -hex 16` and keep it out of your config:
  #   encryption_key: !secret bthome_encryption_key
  encryption_key: "00000000000000000000000000000000"
  sensors:
    - type: temperature
      source: cpu_temp
    - type: humidity
      source: fake_humidity
  binary_sensors:
    - type: motion
      source: fake_motion
  text_sensors:
    - source: status_text
