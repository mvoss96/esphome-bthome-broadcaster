name: CI

on:
  # Only main: a push to a branch with an open PR is already covered by the
  # pull_request trigger below, and matching both ran the whole matrix twice
  # for every push. A branch without a PR gets no CI until one is opened.
  # Tags are handled by release.yml.
  push:
    branches: [main]
    paths:
      - "components/**"
      - "example.yaml"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "components/**"
      - "example.yaml"
      - "tests/**"
      - ".github/workflows/ci.yml"

# A newer push to the same branch supersedes the running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range: the documented minimum catches
        # accidental use of newer schema APIs, the floating latest catches
        # breaking changes upstream.
        esphome: ["==2026.7.0", ""]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: pip install "esphome${{ matrix.esphome }}"
      - name: Validate configs
        run: |
          esphome config example.yaml
          esphome config tests/esp32.yaml

  compile:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: example.yaml
            esphome: ""
            label: latest
          - config: tests/esp32.yaml
            esphome: ""
            label: latest
          # `esphome config` never runs to_code, so codegen APIs are only
          # covered here. This entry is what would have caught
          # request_bluetooth(ble_42=...) becoming incompatible.
          - config: example.yaml
            esphome: "==2026.7.0"
            label: min
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Installed before the cache step so the resolved ESPHome version can key
      # it: what lands in ~/.platformio is the toolchain and framework ESPHome
      # pulls in, which changes with the ESPHome version and with nothing else
      # in this repository.
      - name: Install ESPHome
        id: esphome
        run: |
          pip install "esphome${{ matrix.esphome }}"
          echo "version=$(esphome version | sed 's/^Version: //')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          # Previously keyed on hashFiles('**/*.yaml'), so editing a test
          # sensor missed the key. restore-keys still restored the toolchain,
          # but every run then re-uploaded a fresh copy under a new key and
          # pushed older entries out of the 10 GB cache limit. Keyed on the
          # ESPHome version it is written once per release and hit afterwards.
          key: pio-${{ runner.os }}-${{ matrix.config }}-esphome${{ steps.esphome.outputs.version }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.config }}-
      - name: Compile
        run: |
          set -o pipefail
          esphome compile ${{ matrix.config }} 2>&1 | tee build.log
      - name: Fail on component warnings
        run: |
          if grep -i "warning" build.log | grep -q "bthome_broadcaster"; then
            echo "::error::Compiler warnings in bthome_broadcaster:"
            grep -i "warning" build.log | grep "bthome_broadcaster"
            exit 1
          fi
