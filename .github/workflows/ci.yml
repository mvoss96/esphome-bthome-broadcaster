name: CI

on:
  push:
    branches: ["**"]  # tags are handled by release.yml
    paths:
      - "components/**"
      - "example.yaml"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "components/**"
      - "example.yaml"
      - "tests/**"
      - ".github/workflows/ci.yml"

# A newer push to the same branch supersedes the running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range: the documented minimum catches
        # accidental use of newer schema APIs, the floating latest catches
        # breaking changes upstream.
        esphome: ["==2026.7.0", ""]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: pip install "esphome${{ matrix.esphome }}"
      - name: Validate configs
        run: |
          esphome config example.yaml
          esphome config tests/esp32.yaml

  compile:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: example.yaml
            esphome: ""
            label: latest
          - config: tests/esp32.yaml
            esphome: ""
            label: latest
          # `esphome config` never runs to_code, so codegen APIs are only
          # covered here. This entry is what would have caught
          # request_bluetooth(ble_42=...) becoming incompatible.
          - config: example.yaml
            esphome: "==2026.7.0"
            label: min
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.config }}-${{ matrix.label }}-${{ hashFiles('**/*.yaml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.config }}-${{ matrix.label }}-
      - name: Install ESPHome
        run: pip install "esphome${{ matrix.esphome }}"
      - name: Compile
        run: |
          set -o pipefail
          esphome compile ${{ matrix.config }} 2>&1 | tee build.log
      - name: Fail on component warnings
        run: |
          if grep -i "warning" build.log | grep -q "bthome_broadcaster"; then
            echo "::error::Compiler warnings in bthome_broadcaster:"
            grep -i "warning" build.log | grep "bthome_broadcaster"
            exit 1
          fi
