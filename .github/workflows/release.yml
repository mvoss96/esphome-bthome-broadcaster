name: Release

# On every version tag: extract the tag's CHANGELOG.md section as the release
# notes (no section, no release), compile both targets against the current
# ESPHome stable release, then publish a GitHub release — or complete one
# started from the web UI (which pushes the same tag) — stating exactly which
# ESPHome version this tag was tested against.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            !found && $0 ~ "^## "tag"( |$)" { found=1; next }
            found && (/^## / || /^---/) { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md || {
            echo "::error::CHANGELOG.md has no section '## $GITHUB_REF_NAME' — add one before tagging"
            exit 1
          }
          cat release-notes.md

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-release-${{ runner.os }}-${{ hashFiles('**/*.yaml') }}
          restore-keys: |
            pio-release-${{ runner.os }}-
            pio-${{ runner.os }}-example.yaml-
      - name: Install ESPHome
        run: pip install esphome
      - name: Capture versions
        id: versions
        run: |
          ESPHOME_VERSION=$(esphome version | sed 's/^Version: //')
          BTHOME_CPP_PIN=$(grep -o 'bthome-cpp.git#[^"]*' components/bthome_broadcaster/__init__.py | cut -d'#' -f2)
          echo "esphome=$ESPHOME_VERSION" >> "$GITHUB_OUTPUT"
          echo "bthome_cpp=$BTHOME_CPP_PIN" >> "$GITHUB_OUTPUT"
      - name: Compile ESP32-C6
        run: |
          set -o pipefail
          esphome compile example.yaml 2>&1 | tee build-c6.log
      - name: Compile ESP32
        run: |
          set -o pipefail
          esphome compile tests/esp32.yaml 2>&1 | tee build-esp32.log
      - name: Fail on component warnings
        run: |
          if grep -hi "warning" build-*.log | grep -q "bthome_broadcaster"; then
            echo "::error::Compiler warnings in bthome_broadcaster:"
            grep -hi "warning" build-*.log | grep "bthome_broadcaster"
            exit 1
          fi
      - name: Append tested-against footer
        run: |
          cat >> release-notes.md <<'EOF'

          ---
          **Tested against ESPHome ${{ steps.versions.outputs.esphome }}** (esp32-c6 and esp32, esp-idf framework).
          bthome-cpp dependency: `${{ steps.versions.outputs.bthome_cpp }}`
          EOF

      - name: Create or complete the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Tag came from a web-UI release: the changelog section replaces
            # whatever was typed there — CHANGELOG.md is the source of truth.
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
