esphome:
  name: bthome-test-esp32

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../components

esp32_ble:

sensor:
  - platform: template
    id: fake_temperature
    lambda: return 21.5;
    update_interval: 30s

  - platform: template
    id: fake_humidity
    lambda: return 42.0;
    update_interval: 30s

  # Integer-typed BTHome measurement: instantiates rounded_factory. The value
  # is deliberately outside uint8_t so the clamping path is exercised too.
  - platform: template
    id: fake_battery
    lambda: return 300.0;
    update_interval: 30s

binary_sensor:
  - platform: template
    id: fake_motion
    lambda: return millis() % 20000 < 10000;

text_sensor:
  - platform: template
    id: status_text
    lambda: return {"long text that gets truncated"};
    update_interval: 60s

# Exercises the event actions incl. multi-button padding and templated steps.
interval:
  - interval: 60s
    then:
      - bthome_broadcaster.button_event:
          event: double_press
          button_index: 2
      # Deepest index: 5 padding entries plus the in-advertisement name no
      # longer fit into 31 bytes, so the name has to be dropped here.
      - bthome_broadcaster.button_event:
          event: press
          button_index: 6
      - bthome_broadcaster.dimmer_event:
          event: rotate_right
          steps: !lambda return 5;
      # Command event with a templated argument, and one without steps at all
      # (plaintext here, so this config also exercises the unencrypted warning).
      - bthome_broadcaster.command_event:
          command: step_down
          steps: !lambda return 3;
      - bthome_broadcaster.command_event:
          command: "off"

bthome_broadcaster:
  interval: 10s
  # 12 bytes with a 2-byte "ö" straddling the 10-byte advertisement limit:
  # exercises the UTF-8-safe truncation (result: "BüroSens").
  name: "BüroSensör"
  # Exercises the name-in-advertisement code path (default is scan_response).
  name_placement: advertisement
  sensors:
    - type: temperature
      source: fake_temperature
    - type: humidity
      source: fake_humidity
    - type: battery
      source: fake_battery
  binary_sensors:
    - type: motion
      source: fake_motion
  text_sensors:
    - source: status_text
